[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberwolf"
version = "2.0.0"
description = "CYBERWOLF V2 — Professional Cybersecurity Assessment & Intelligence Platform"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "CYBERWOLF Team" }
]
dependencies = [
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "reportlab>=4.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0"
]

[project.scripts]
cyberwolf = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]
